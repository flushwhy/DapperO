name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Odin
        uses: laytan/setup-odin@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare pinned Gamejoltodin source
        shell: cmd
        run: scripts\setup_gamejoltodin.bat

      - name: Check Gamejoltodin example
        run: odin check examples/gamejoltodin -collection:gamejolt=vendor/Gamejoltodin

      - name: Configure MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build DapperO
        run: odin build . -linker:lld -collection:gamejolt=vendor/Gamejoltodin
