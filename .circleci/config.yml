version: 2.1

jobs:
  build:
    docker:
      - image: primeimages/odin:latest
    steps:
      - checkout
      - run:
          name: Prepare pinned Gamejoltodin source
          command: sh scripts/setup_gamejoltodin.sh
      - run:
          name: Check Gamejoltodin integration example
          command: odin check examples/gamejoltodin
      - run:
          name: Build DapperO
          command: odin build .

workflows:
  build:
    jobs:
      - build
